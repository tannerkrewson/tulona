name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate iOS project and widget
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test widget state mapping
        run: npm run test:widget

      - name: Validate Expo configuration
        env:
          EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
        run: |
          npx expo config --json > expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('expo-config.json', 'utf8'));
          const widgetPlugin = (config.plugins ?? []).find((plugin) =>
            Array.isArray(plugin) && plugin[0] === 'expo-widgets'
          );
          if (config.ios?.bundleIdentifier !== 'com.tannerkrewson.tulona') {
            throw new Error('Unexpected iOS bundle identifier');
          }
          if (widgetPlugin?.[1]?.widgets?.[0]?.ios?.supportedFamilies?.includes('systemSmall') !== true) {
            throw new Error('The ActiveActivityWidget systemSmall family is not configured');
          }
          NODE

      - name: Generate native iOS project
        env:
          EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
        run: |
          npx expo prebuild --platform ios --no-install
          test -f ios/Tulona.xcodeproj/project.pbxproj
          test -f ios/ExpoWidgetsTarget/ActiveActivityWidget.swift
          grep -Fq 'ExpoWidgetsTarget' ios/Tulona.xcodeproj/project.pbxproj
          grep -Fq '.systemSmall' ios/ExpoWidgetsTarget/ActiveActivityWidget.swift

  build:
    name: Build and package IPA
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check EAS project settings
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret before running the iOS build."
            exit 1
          fi
          if [ -z "$EXPO_EAS_PROJECT_ID" ]; then
            echo "::error::Add the EXPO_EAS_PROJECT_ID repository variable before running the iOS build."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app with EAS
        env:
          EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
        run: eas build --platform ios --profile production --non-interactive --wait --json > build-result.json

      - name: Download and validate IPA
        env:
          EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
        run: |
          BUILD_ID=$(node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('build-result.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (!build?.id) {
            throw new Error('EAS did not return a build ID');
          }
          process.stdout.write(build.id);
          NODE
          )
          eas build:download --build-id "$BUILD_ID" --json > download-result.json
          IPA_SOURCE=$(node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('download-result.json', 'utf8'));
          if (!result.path) {
            throw new Error('EAS did not return an IPA path');
          }
          process.stdout.write(result.path);
          NODE
          )
          mkdir -p artifacts
          cp "$IPA_SOURCE" "artifacts/Tulona-${GITHUB_SHA}.ipa"
          unzip -t "artifacts/Tulona-${GITHUB_SHA}.ipa" >/dev/null
          unzip -l "artifacts/Tulona-${GITHUB_SHA}.ipa" > ipa-contents.txt
          grep -Fq 'ExpoWidgetsTarget.appex/Info.plist' ipa-contents.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulona-iOS-${{ github.sha }}
          path: artifacts/Tulona-${{ github.sha }}.ipa
          if-no-files-found: error
          retention-days: 14
