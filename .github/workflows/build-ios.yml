name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_DROPBOX_APP_KEY: ${{ vars.EXPO_PUBLIC_DROPBOX_APP_KEY }}

jobs:
  validate:
    name: Validate iOS app configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test widget state mapping
        run: npm run test:widget

      - name: Test Goals runtime and native event guards
        run: npm run test:goals-ui

      - name: Test native Settings and Habits UI boundaries
        run: |
          npm run test:settings-ui
          npm run test:native-screen-layout
          npm run test:habit-ui

      - name: Test restored root route wiring
        run: |
          npm run test:ticktick-import-ui
          npm run test:active-session
          npm run test:history-ui
          npm run test:pwa-ui

      - name: Test Dropbox sync merge behavior
        run: npm run test:dropbox-sync

      - name: Test Dropbox backup UI contract
        run: npm run test:dropbox-ui

      - name: Validate iOS JavaScript bundle
        run: |
          bundle_dir="$(mktemp -d)"
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform ios \
            --dev false \
            --bundle-output "$bundle_dir/main.jsbundle" \
            --assets-dest "$bundle_dir/assets" \
            --minify false
          test -s "$bundle_dir/main.jsbundle"

      - name: Validate Expo configuration
        run: |
          npx expo config --json > expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('expo-config.json', 'utf8'));
          const widgetPlugin = (config.plugins ?? []).find(
            (plugin) => Array.isArray(plugin) && plugin[0] === 'expo-widgets'
          );
          const routerPlugin = (config.plugins ?? []).find(
            (plugin) => Array.isArray(plugin) && plugin[0] === 'expo-router'
          );
          if (config.ios?.bundleIdentifier !== 'com.tannerkrewson.tulona') {
            throw new Error('Unexpected iOS bundle identifier');
          }
          if (routerPlugin?.[1]?.origin !== 'https://www.tannerkrewson.com') {
            throw new Error('Expo Router must be configured with the hosted handoff origin');
          }
          if (widgetPlugin?.[1]?.groupIdentifier !== 'group.com.tannerkrewson.tulona') {
            throw new Error('The iOS widget and app must share their configured app group');
          }
          if (
            !widgetPlugin?.[1]?.widgets?.some((widget) => widget.name === 'ActiveActivityWidget')
          ) {
            throw new Error('ActiveActivityWidget must be configured');
          }
          NODE

      - name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --no-install --clean
          test -f ios/Tulona.xcodeproj/project.pbxproj
          test -e ios/ExpoWidgetsTarget
          if ! grep -Fq 'ExpoWidgetsTarget' ios/Tulona.xcodeproj/project.pbxproj; then
            echo 'The generated Xcode project is missing its widget extension target'
            exit 1
          fi
          if ! grep -R -Fq 'group.com.tannerkrewson.tulona' ios/Tulona; then
            echo 'The generated iOS app is missing its widget app-group entitlement'
            exit 1
          fi
          grep -Fq 'ActiveActivityWidgetBridge' app/_layout.tsx
          grep -Fq 'expo-router/native-tabs' src/navigation/AppTabs.native.tsx
          grep -Fq 'name="(tracker)"' src/navigation/AppTabs.native.tsx
          if grep -Fq 'nativeTabsPolicy' src/navigation/AppTabs.native.tsx; then
            echo 'Native tabs must not be bypassed for iOS 27'
            exit 1
          fi

  build:
    name: Build unsigned IPA
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project with widgets
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -workspace ios/Tulona.xcworkspace \
            -scheme Tulona \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tulona.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            archive

      - name: Verify Expo JSI native linkage
        run: python3 scripts/verify-ios-jsi-linkage.py "$RUNNER_TEMP/Tulona.xcarchive/Products/Applications/Tulona.app"

      - name: Upload iOS debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: Tulona-${{ github.sha }}-dSYMs
          path: ${{ runner.temp }}/Tulona.xcarchive/dSYMs/Tulona.app.dSYM
          if-no-files-found: error
          retention-days: 14

      - name: Package and validate unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Tulona.xcarchive/Products/Applications/Tulona.app"
          test -d "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          WIDGET_PATH="$APP_PATH/PlugIns/ExpoWidgetsTarget.appex"
          test -d "$WIDGET_PATH"
          test ! -d "$WIDGET_PATH/_CodeSignature"
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/Tulona.app
          (
            cd artifacts
            zip -qry "Tulona-${GITHUB_SHA}-unsigned.ipa" Payload
          )
          unzip -t "artifacts/Tulona-${GITHUB_SHA}-unsigned.ipa" >/dev/null
          unzip -l "artifacts/Tulona-${GITHUB_SHA}-unsigned.ipa" > ipa-contents.txt
          if ! grep -Fq 'ExpoWidgetsTarget.appex' ipa-contents.txt; then
            echo 'The unsigned IPA is missing the widget extension'
            exit 1
          fi

      - name: Upload unsigned IPA directly
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Tulona-${{ github.sha }}-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
