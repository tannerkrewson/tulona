name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate iOS navigation without widget extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate iOS JavaScript bundle
        run: |
          bundle_dir="$(mktemp -d)"
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform ios \
            --dev false \
            --bundle-output "$bundle_dir/main.jsbundle" \
            --assets-dest "$bundle_dir/assets" \
            --minify false
          test -s "$bundle_dir/main.jsbundle"

      - name: Validate Expo configuration
        run: |
          npx expo config --json > expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('expo-config.json', 'utf8'));
          const widgetPlugin = (config.plugins ?? []).find((plugin) =>
            Array.isArray(plugin) && plugin[0] === 'expo-widgets'
          );
          if (config.ios?.bundleIdentifier !== 'com.tannerkrewson.tulona') {
            throw new Error('Unexpected iOS bundle identifier');
          }
          if (widgetPlugin) {
            throw new Error('The diagnostic iOS build must not include the expo-widgets plugin');
          }
          NODE

      - name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --no-install --clean
          test -f ios/Tulona.xcodeproj/project.pbxproj
          test ! -e ios/ExpoWidgetsTarget
          ! grep -Fq 'ExpoWidgetsTarget' ios/Tulona.xcodeproj/project.pbxproj
          ! grep -Fq 'ActiveActivityWidgetBridge' app/_layout.tsx
          grep -Fq 'expo-router/unstable-native-tabs' src/navigation/AppTabs.native.tsx
          grep -Fq 'name="(tracker)"' src/navigation/AppTabs.native.tsx
          grep -Fq 'gestureEnabled: true' 'app/(tabs)/(tracker)/_layout.tsx'

  build:
    name: Build unsigned IPA
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project without widget extension
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -workspace ios/Tulona.xcworkspace \
            -scheme Tulona \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tulona.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            archive

      - name: Package and validate unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Tulona.xcarchive/Products/Applications/Tulona.app"
          test -d "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -e "$APP_PATH/PlugIns/ExpoWidgetsTarget.appex"
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/Tulona.app
          (
            cd artifacts
            zip -qry "Tulona-${GITHUB_SHA}-unsigned-no-widget.ipa" Payload
          )
          unzip -t "artifacts/Tulona-${GITHUB_SHA}-unsigned-no-widget.ipa" >/dev/null
          unzip -l "artifacts/Tulona-${GITHUB_SHA}-unsigned-no-widget.ipa" > ipa-contents.txt
          ! grep -Fq '.appex/' ipa-contents.txt

      - name: Upload unsigned IPA directly
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Tulona-${{ github.sha }}-unsigned-no-widget.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
