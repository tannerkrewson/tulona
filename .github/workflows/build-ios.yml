name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate iOS launch diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test widget state mapping
        run: npm run test:widget

      - name: Test fatal launch error capture
        run: npm run test:launch-crash-reporter

      - name: Test TurboModule diagnostic patch
        run: npm run test:turbo-module-diagnostic-patch

      - name: Validate iOS JavaScript bundle
        run: |
          bundle_dir="$(mktemp -d)"
          npx expo export:embed \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output "$bundle_dir/main.jsbundle" \
            --assets-dest "$bundle_dir/assets" \
            --minify false
          test -s "$bundle_dir/main.jsbundle"

      - name: Validate Expo configuration
        run: |
          npx expo config --json > expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('expo-config.json', 'utf8'));
          const widgetPlugin = (config.plugins ?? []).find(
            (plugin) => Array.isArray(plugin) && plugin[0] === 'expo-widgets'
          );
          const packageConfig = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (config.ios?.bundleIdentifier !== 'com.tannerkrewson.tulona') {
            throw new Error('Unexpected iOS bundle identifier');
          }
          if (widgetPlugin) {
            throw new Error('The diagnostic build must not configure expo-widgets');
          }
          if (
            !packageConfig.expo?.autolinking?.apple?.exclude?.includes('expo-widgets')
          ) {
            throw new Error('expo-widgets must be excluded from Apple autolinking');
          }
          NODE

      - name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --no-install --clean
          test -f ios/Tulona.xcodeproj/project.pbxproj
          test ! -e ios/ExpoWidgetsTarget
          if grep -Fq 'ExpoWidgetsTarget' ios/Tulona.xcodeproj/project.pbxproj; then
            echo 'Unexpected widget extension target in generated Xcode project'
            exit 1
          fi
          if grep -R -Fq 'group.com.tannerkrewson.tulona' ios/Tulona; then
            echo 'Unexpected widget app-group entitlement in generated iOS app'
            exit 1
          fi
          if grep -Fq 'ActiveActivityWidgetBridge' app/_layout.tsx; then
            echo 'The diagnostic root must not mount the widget bridge'
            exit 1
          fi
          grep -Fq 'LAUNCH_CRASH_REPORT_KEY' app/_layout.tsx
          grep -Fq 'installLaunchCrashReporter' index.js
          grep -Fq 'expo-router/unstable-native-tabs' src/navigation/AppTabs.native.tsx
          grep -Fq 'name="(tracker)"' src/navigation/AppTabs.native.tsx
          grep -Fq 'gestureEnabled: true' 'app/(tabs)/(tracker)/_layout.tsx'

  build:
    name: Build unsigned IPA
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS diagnostic project without widgets
        env:
          TULONA_DIAGNOSTIC_TURBOMODULE_CATCH: '1'
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Verify TurboModule diagnostic patch
        run: node scripts/verify-turbo-module-diagnostic-patch.cjs

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -workspace ios/Tulona.xcworkspace \
            -scheme Tulona \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tulona.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            archive

      - name: Package and validate unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Tulona.xcarchive/Products/Applications/Tulona.app"
          test -d "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          WIDGET_PATH="$APP_PATH/PlugIns/ExpoWidgetsTarget.appex"
          test ! -e "$WIDGET_PATH"
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/Tulona.app
          (
            cd artifacts
            zip -qry "Tulona-${GITHUB_SHA}-unsigned.ipa" Payload
          )
          unzip -t "artifacts/Tulona-${GITHUB_SHA}-unsigned.ipa" >/dev/null
          unzip -l "artifacts/Tulona-${GITHUB_SHA}-unsigned.ipa" > ipa-contents.txt
          if grep -Fq 'ExpoWidgetsTarget.appex' ipa-contents.txt; then
            echo 'The diagnostic IPA unexpectedly contains a widget extension'
            exit 1
          fi

      - name: Upload unsigned IPA directly
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Tulona-${{ github.sha }}-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
