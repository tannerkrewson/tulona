name: Check read-only MCP

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'src/domain/**'
      - 'src/backup/backup-import.ts'
      - 'src/backup/backup-schema.ts'
      - '.github/workflows/check-mcp.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'mcp/**'
      - 'src/domain/**'
      - 'src/backup/backup-import.ts'
      - 'src/backup/backup-schema.ts'
      - '.github/workflows/check-mcp.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp --ignore-scripts --legacy-peer-deps=false
      - run: npm --prefix mcp run typecheck
      - run: npm --prefix mcp test
      - name: Ensure the shipped CLI matches shared source
        run: git diff --exit-code -- mcp/bin

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v5
        with:
          path: source
      - name: Check out MCP distribution
        uses: actions/checkout@v5
        with:
          ref: mcp
          path: distribution
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Package the bundled server without Expo dependencies
        run: node source/mcp/package.mjs distribution
      - name: Update the MCP distribution branch
        working-directory: distribution
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json README.md LICENSE bin
          if ! git diff --cached --quiet; then
            git commit -m "Update MCP distribution from $SOURCE_SHA"
            git push origin HEAD:mcp
          fi
